# python -m src.models.tune ile doğrulama katlarında seçildi — elle düzenlemeyin
lightgbm:
  colsample_bytree: 0.5
  learning_rate: 0.02
  min_child_samples: 10
  n_estimators: 1000
  num_leaves: 127
  reg_lambda: 1.0
  subsample: 0.8
  subsample_freq: 1
  tweedie_variance_power: 1.7
  verbose: -1
random_forest:
  max_depth: null
  max_features: 0.33
  min_samples_leaf: 20
  n_estimators: 300
  n_jobs: -1
xgboost:
  colsample_bytree: 0.5
  learning_rate: 0.05
  max_depth: 8
  min_child_weight: 1
  n_estimators: 600
  reg_lambda: 5.0
  subsample: 1.0
  tweedie_variance_power: 1.5
